<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e" />
      <stop offset="50%" stop-color="#0b162c" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#8e2de2" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00d2ff" flood-opacity="0.15" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    .orb-glow1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 120px; }
    .orb-glow2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1020px 280px; }
    .data-stream { stroke-dasharray: 12, 12; animation: flowLine 20s linear infinite; }
    .pill-float-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill2 6s ease-in-out infinite; }
    .tech-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .tech-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .tech-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />
  <rect width="1200" height="400" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <circle class="orb-glow1" cx="180" cy="120" r="140" fill="#0284c7" filter="url(#glow)" />
  <circle class="orb-glow2" cx="1020" cy="280" r="160" fill="#7c3aed" filter="url(#glow)" />
  <circle class="orb-glow1" cx="600" cy="350" r="120" fill="#0d9488" opacity="0.2" filter="url(#glow)" />

  <!-- Flowing Network Connection Streams (Background) -->
  <g opacity="0.6">
    <path class="data-stream" d="M -50 200 Q 300 80 600 200 T 1250 200" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-stream" d="M -50 260 Q 350 360 650 240 T 1250 180" fill="none" stroke="#818cf8" stroke-width="1.5" style="animation-duration: 25s;" />
    <path class="data-stream" d="M 100 -20 Q 400 220 700 80 T 1250 320" fill="none" stroke="#2dd4bf" stroke-width="1.2" style="animation-duration: 18s;" />
  </g>

  <!-- Dynamic Feature Pills (positioned comfortably at the bottom) -->
  <g class="pill-float-1">
    <rect x="110" y="320" width="160" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" filter="url(#cardGlow)" opacity="0.9" />
    <circle cx="128" cy="338" r="6" fill="#38bdf8" />
    <text x="144" y="343" class="tech-pill" fill="#e2e8f0">Apache Iceberg</text>

    <rect x="300" y="320" width="140" height="36" rx="18" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" filter="url(#cardGlow)" opacity="0.9" />
    <circle cx="318" cy="338" r="6" fill="#818cf8" />
    <text x="334" y="343" class="tech-pill" fill="#e2e8f0">StarRocks</text>
  </g>

  <g class="pill-float-2">
    <rect x="470" y="320" width="145" height="36" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" filter="url(#cardGlow)" opacity="0.9" />
    <circle cx="488" cy="338" r="6" fill="#f59e0b" />
    <text x="504" y="343" class="tech-pill" fill="#e2e8f0">ClickHouse</text>

    <rect x="645" y="320" width="125" height="36" rx="18" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" filter="url(#cardGlow)" opacity="0.9" />
    <circle cx="663" cy="338" r="6" fill="#ec4899" />
    <text x="679" y="343" class="tech-pill" fill="#e2e8f0">Trino SQL</text>

    <rect x="798" y="320" width="160" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.2" filter="url(#cardGlow)" opacity="0.9" />
    <circle cx="816" cy="338" r="6" fill="#10b981" />
    <text x="832" y="343" class="tech-pill" fill="#e2e8f0">Unity Catalog</text>

    <rect x="985" y="320" width="135" height="36" rx="18" fill="#0f172a" stroke="#eab308" stroke-width="1.2" filter="url(#cardGlow)" opacity="0.9" />
    <circle cx="1003" cy="338" r="6" fill="#eab308" />
    <text x="1019" y="343" class="tech-pill" fill="#e2e8f0">DuckDB</text>
  </g>

  <!-- FOREGROUND: Header Brand & Title (Clean, Sharp, Unobstructed) -->
  <g transform="translate(600, 85)" text-anchor="middle">
    <!-- Tagline Pill -->
    <rect x="-160" y="-18" width="320" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95" />
    <text x="0" y="1" class="tech-pill" fill="#38bdf8" font-size="12" letter-spacing="1.5">MODERN DATA STACK &amp; LAKEHOUSE</text>

    <!-- Primary Title -->
    <text x="0" y="70" class="tech-title" fill="url(#titleGrad)" font-size="42" letter-spacing="-0.5">Cloud Data Platform &amp; Data Cloud</text>

    <!-- Secondary Subtitle -->
    <text x="0" y="112" class="tech-sub" fill="#94a3b8" font-size="17" letter-spacing="0.2">
      Curated Landscape of Enterprise SaaS Warehouses, Open Lakehouse Formats &amp; Vectorized Engines
    </text>

    <!-- Category Highlights Subtext -->
    <text x="0" y="145" class="tech-sub" fill="#64748b" font-size="13.5" font-weight="500">
      Snowflake • Databricks • BigQuery • Fabric • Redshift • Iceberg • Spark • StarRocks • DuckDB • Polaris
    </text>
  </g>

  <!-- Bottom Accent Border Glow -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
